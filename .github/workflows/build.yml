
name: RANK1 CMD Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile
        shell: cmd
        run: |
          cl.exe /nologo /EHsc /W1 /O2 /MT /utf-8 /D_CRT_SECURE_NO_WARNINGS main.cpp /Fe:BYrank1shop.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib kernel32.lib dwmapi.lib

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BYrank1shop
          path: BYrank1shop.exe
